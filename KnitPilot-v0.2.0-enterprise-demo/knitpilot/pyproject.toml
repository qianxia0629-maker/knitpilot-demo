[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knitpilot"
version = "0.1.0"
description = "AI-assisted, deterministic knitwear specification drafts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["packages.engine"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
